# Image
image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

# Scaling
replicaCount: 2

# Networking
service:
  type: ClusterIP
  port: 80

# Resources
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Application config
config:
  APP_PORT: "8080"
  LOG_LEVEL: "info"

# Environment
environment: dev