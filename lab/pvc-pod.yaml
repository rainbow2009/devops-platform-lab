apiVersion: v1
kind: Pod
metadata:
  name: storage-test
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data          # mount point inside the container
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc         # which PVC to use