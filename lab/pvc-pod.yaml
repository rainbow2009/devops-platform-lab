apiVersion: v1
kind: Pod
metadata:
  name: storage-test
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data          # куда диск монтируется внутри контейнера
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc         # какую заявку использовать