apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probes-demo
  template:
    metadata:
      labels:
        app: probes-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /                # nginx returns 200 on /
              port: 80
            initialDelaySeconds: 5   # wait 5s after container start
            periodSeconds: 5         # check every 5s
            failureThreshold: 3      # 3 failures in a row = restart
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: probes-demo
spec:
  selector:
    app: probes-demo
  ports:
    - port: 80